<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ADL Finances</title>
    <link href="https://googleapis.com" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;font-family:'Inter',sans-serif;background:#0a1628;color:#e2e8f4;font-size:14px}
        ::-webkit-scrollbar{width:4px;height:4px}
        ::-webkit-scrollbar-thumb{background:#1e3459;border-radius:4px}
        #app{display:flex;height:100vh;width:100vw;overflow:hidden}
        #sidebar{width:240px;min-width:240px;background:#060e1f;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;position:relative;z-index:2}
        #brand{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,0.06);text-align:center}
        #brand h2{font-size:18px;font-weight:600;color:#fff;}
        #folders-wrap{flex:1;overflow-y:auto;padding:10px 0}
        .sec-label{font-size:10px;font-weight:600;color:#4b5563;letter-spacing:1px;text-transform:uppercase;padding:6px 16px 4px}
        .folder-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;font-size:12.5px;color:#6b7280;border-left:2px solid transparent;transition:all .15s;position:relative}
        .folder-btn:hover{background:rgba(255,255,255,0.03);color:#d1d5db}
        .folder-btn.active{background:rgba(59,130,246,0.1);color:#93c5fd;border-left-color:#3b82f6}
        .folder-btn .f-icon{font-size:13px;width:16px;text-align:center}
        .folder-btn .f-name{flex:1;font-size:12px}
        .folder-btn .f-count{font-size:10px;background:rgba(255,255,255,0.06);color:#6b7280;padding:1px 6px;border-radius:10px}
        #sidebar-bottom{padding:10px 12px 14px;border-top:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:10px;}
        #btn-nova-pasta{width:100%;background:transparent;border:1px dashed rgba(255,255,255,0.12);color:#6b7280;font-size:12px;font-family:'Inter',sans-serif;padding:8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
        #btn-nova-pasta:hover{border-color:#3b82f6;color:#3b82f6;background:rgba(59,130,246,0.06)}
        #main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0d1b2e;position:relative;padding:20px;}
        
        /* Botão de Configurações e Modal */
        .settings-btn {display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;font-size:12.5px;color:#6b7280;background:transparent;border:none;text-align:left;width:100%;transition:all .15s;}
        .settings-btn:hover {background:rgba(255,255,255,0.03);color:#d1d5db}
        .modal-config {display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:999;align-items:center;justify-content:center;}
        .modal-config.show {display:flex;}
        .modal-content {background:#060e1f;border:1px solid rgba(255,255,255,0.06);padding:24px;border-radius:12px;width:90%;max-width:400px;position:relative;}
        .close-modal {position:absolute;top:15px;right:15px;background:transparent;border:none;color:#6b7280;cursor:pointer;font-size:16px;}
        .close-modal:hover {color:#ef4444;}
    </style>
</head>
<body>

<div id="app">
    <!-- Barra Lateral -->
    <div id="sidebar">
        <div id="brand">
            <h2>ADL Finances</h2>
        </div>
        
        <div id="folders-wrap">
            <div class="sec-label">Minhas Pastas</div>
            <div class="folder-btn active">
                <i class="fa-solid fa-folder f-icon"></i>
                <span class="f-name">Geral</span>
                <span class="f-count">0</span>
            </div>
        </div>

        <div id="sidebar-bottom">
            <button id="btn-nova-pasta">
                <i class="fa-solid fa-plus"></i> Nova Pasta
            </button>
            
            <button id="btn-configuracoes" class="settings-btn">
                <i class="fa-solid fa-gear"></i> Configurações
            </button>
        </div>
    </div>

    <!-- Painel Principal -->
    <div id="main">
        <h1>Dashboard Financeiro</h1>
        <p style="color:#6b7280; margin-top:5px;">Bem-vindo ao ADL Finances. Gerencie seus fluxos aqui.</p>
    </div>
</div>

<!-- Janela de Configurações -->
<div id="modal-configuracoes" class="modal-config">
    <div class="modal-content">
        <button id="btn-fechar-modal" class="close-modal"><i class="fa-solid fa-xmark"></i></button>
        <h3 style="margin-bottom:15px; color:#fff;"><i class="fa-solid fa-gear"></i> Ajustes do Sistema</h3>
        <p style="color:#6b7280; font-size:13px; margin-bottom:20px;">Modifique os parâmetros da sua conta.</p>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <label style="font-size:12px; color:#93c5fd;">Tema do Painel</label>
            <select style="background:#0d1b2e; border:1px solid rgba(255,255,255,0.1); color:#fff; padding:8px; border-radius:6px;">
                <option>Escuro (Padrão)</option>
                <option>Claro</option>
            </select>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const btnConfig = document.getElementById("btn-configuracoes");
        const modalConfig = document.getElementById("modal-configuracoes");
        const btnFechar = document.getElementById("btn-fechar-modal");

        if(btnConfig && modalConfig) {
            btnConfig.addEventListener("click", function() {
                modalConfig.classList.add("show");
            });
        }

        if(btnFechar && modalConfig) {
            btnFechar.addEventListener("click", function() {
                modalConfig.classList.remove("show");
            });
        }

        window.addEventListener("click", function(event) {
            if (event.target == modalConfig) {
                modalConfig.classList.remove("show");
            }
        });
    });
</script>

</body>
</html>
